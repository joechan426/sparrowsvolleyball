<!DOCTYPE html>
<!--
  ============================================================================
  REDIRECT PAGE — the old Google-Sheets based tournament scoring system has
  been retired in favour of https://sparrowsweb.netlify.app/tournaments

  Visitors to the site root are sent straight to the new system. The visible
  text below is only a fallback for the rare case where both the script and
  the meta refresh are blocked.

  NOTE: all user-visible text in this repository must be English only.

  The old system has NOT been deleted. Its full source now lives in
  `legacy-scoring.html` (unchanged, same folder, so all `content/...` asset
  paths still resolve).

  TO RESTORE THE OLD SYSTEM INSTANTLY:
      git mv index.html redirect.html
      git mv legacy-scoring.html index.html
      git commit -m "Restore legacy tournament scoring system"
      git push

  Or, without git, simply rename `legacy-scoring.html` back to `index.html`
  in the GitHub web editor.

  The old system also stays reachable at any time via:
      https://joechan426.github.io/sparrowsvolleyball/legacy-scoring.html
      https://sparrowsliveresults.netlify.app/legacy-scoring.html
  ============================================================================
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sparrows Tournament — Redirecting</title>
  <link rel="canonical" href="https://sparrowsweb.netlify.app/tournaments" />
  <meta name="robots" content="noindex" />
  <!-- Redirect as early as possible: script first, meta refresh as fallback. -->
  <script>
    window.location.replace('https://sparrowsweb.netlify.app/tournaments');
  </script>
  <meta http-equiv="refresh" content="0; url=https://sparrowsweb.netlify.app/tournaments" />
  <link rel="icon" href="content/img/logo.png" />
  <style>
    :root {
      --sea: #31d1cb;
      --pine: #0b5b53;
      --shell: #fff9ed;
      --lagoon: #12c4a0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(180deg, #b8f3ff 0%, #68e4d2 45%, #ffe7a8 100%);
      background-attachment: fixed;
      margin: 0;
      padding: 24px;
      color: var(--pine);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .card {
      background: var(--shell);
      border-radius: 24px;
      box-shadow: 0 18px 44px rgba(11, 91, 83, 0.22);
      max-width: 460px;
      width: 100%;
      padding: 34px 26px 30px;
    }
    .logo { width: 76px; height: 76px; object-fit: contain; margin-bottom: 12px; }
    h1 { font-size: 22px; margin: 0 0 10px; }
    p { font-size: 16px; line-height: 1.6; margin: 0 0 8px; }
    a.cta {
      display: inline-block;
      margin-top: 18px;
      padding: 15px 28px;
      border-radius: 999px;
      background: linear-gradient(135deg, var(--lagoon), var(--sea));
      color: #ffffff;
      font-size: 17px;
      font-weight: 700;
      text-decoration: none;
      box-shadow: 0 10px 24px rgba(18, 196, 160, 0.42);
    }
    .url { display: block; margin-top: 10px; font-size: 13px; word-break: break-all; color: rgba(11, 91, 83, 0.6); }
  </style>
</head>
<body>
  <main class="card">
    <img class="logo" src="content/img/logo.png" alt="Sparrows Volleyball logo" />
    <h1>Taking you to the new scoring system…</h1>
    <p>Tournament scores are now entered on the new Sparrows site.</p>
    <a class="cta" href="https://sparrowsweb.netlify.app/tournaments">Continue</a>
    <span class="url">https://sparrowsweb.netlify.app/tournaments</span>
  </main>
</body>
</html>
